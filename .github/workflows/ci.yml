name: CI

# Pull requests run without secrets, and never with pull_request_target.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # No install scripts: dependencies don't run code before we use them.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
        env:
          ASTRO_TELEMETRY_DISABLED: 1
      # Validates every incident note against the schema.
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --redact --no-banner
